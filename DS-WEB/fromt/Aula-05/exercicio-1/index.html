<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mostrar Imagem por Letra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Mostrar Imagem por Letra(apenas algumas)</h1>
    
    <br>
    <br>
    <br>

    <div class="container">

        <div class="input-letra">
            <input type="text" id="letra" maxlength="1" placeholder="Digite uma letra">
            <button id="enviar">Enviar</button>
        </div>

        <div class="caixa-imagem">
            <img id="imagem1" src="cauly.pnj.jpg" alt="Cauly">
            <img id="imagem2" src="ronaldoo.jpg" alt="Ronaldo">
            <img id="imagem3" src="images.jpg" alt="Tchoameni">
            <img id="imagem4" src="vinijunior.jpg" alt="Vini Jr." width="100px" height="300px">
            <img id="imagem5" src="neymar.jpg" alt="Neymar">
            <img id="imagem6" src="kwara.jpg" alt="kvaratskhelia" width="100px" height="300px">
            <img id="imagem7" src="Luis_Suárez.jpg" alt="Luis Suárez" width="100px" height="300px">
            <img id="imagem8" src="mbape.jpg" alt="Mbappé" width="100px" height="300px">
            <img id="imagem9" src="ferreirinha.jpg" alt="Ferreirinha" width="100px" height="300px">
            <img id="imagem10" src="yuri.webp" alt="Yuri Alberto" width="100px" height="300px">
            <img id="imagem11" src="aubameyang.jpg" alt="Aubameyang" width="100px" height="300px">
            <img id="imagem12" src="Halland.webp" alt="Halland" width="100px" height="300px">

        </div>

        <div class="nome" id="nome"></div>

    </div>

    <div class="bolinha"></div>

    <script src="script.js"></script>
</body>
</html>
